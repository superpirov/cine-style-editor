<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CineStyle Editor Natural</title>
    <style>
        :root {
            --bg-color: #0f0f13;
            --panel-bg: #1a1a24;
            --text-color: #e0e0e0;
            --accent-cyan: #00f3ff;
            --accent-pink: #bc13fe;
            --neon-glow: 0 0 10px rgba(0, 243, 255, 0.3), 0 0 20px rgba(188, 19, 254, 0.2);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; user-select: none; -webkit-user-select: none; }
        body { background-color: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        header {
            padding: 15px 20px;
            background: linear-gradient(90deg, #1a1a24 0%, #252535 100%);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5); z-index: 10;
        }
        h1 {
            font-size: 1.2rem; font-weight: 700;
            background: linear-gradient(to right, var(--accent-cyan), var(--accent-pink));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 1px;
        }
        .app-container { display: flex; flex: 1; overflow: hidden; }
        .controls {
            width: 320px; background-color: var(--panel-bg); padding: 20px;
            overflow-y: auto; border-right: 1px solid rgba(255,255,255,0.05);
            display: flex; flex-direction: column; gap: 20px; z-index: 5;
        }
        .control-group { display: flex; flex-direction: column; gap: 10px; }
        label { font-size: 0.85rem; color: #aaa; text-transform: uppercase; letter-spacing: 0.5px; }
        button, select {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            color: white; padding: 10px; border-radius: 8px; cursor: pointer;
            transition: all 0.3s ease; font-size: 0.9rem; outline: none; width: 100%;
        }
        button:hover, select:hover { border-color: var(--accent-cyan); box-shadow: 0 0 8px rgba(0, 243, 255, 0.2); }
        .btn-primary { background: linear-gradient(45deg, var(--accent-pink), var(--accent-cyan)); border: none; font-weight: bold; color: #000; }
        .btn-primary:hover { opacity: 0.9; box-shadow: var(--neon-glow); }
        .upload-buttons { display: flex; gap: 8px; }
        .upload-btn-wrapper { position: relative; overflow: hidden; flex: 1; }
        .upload-btn-wrapper input[type=file] { position: absolute; left: 0; top: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
        .upload-btn-wrapper button { pointer-events: none; }
        .canvas-area {
            flex: 1; display: flex; justify-content: center; align-items: center;
            background-image: radial-gradient(circle at center, #2a2a35 0%, #0f0f13 100%);
            position: relative; overflow: hidden; padding: 20px; cursor: grab;
        }
        .canvas-area:active { cursor: grabbing; }
        canvas { max-width: 100%; max-height: 100%; box-shadow: 0 0 30px rgba(0,0,0,0.8); border-radius: 4px; }
        .filter-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; max-height: 400px; overflow-y: auto; padding-right: 5px; }
        .filter-btn { padding: 8px; font-size: 0.8rem; text-align: center; background: rgba(255,255,255,0.03); }
        .filter-btn.active { background: rgba(0, 243, 255, 0.15); border-color: var(--accent-cyan); color: var(--accent-cyan); }
        input[type=range] { width: 100%; -webkit-appearance: none; background: transparent; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%;
            background: var(--accent-cyan); cursor: pointer; margin-top: -6px; box-shadow: 0 0 10px var(--accent-cyan);
        }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: rgba(255,255,255,0.2); border-radius: 2px; }
        .hint { font-size: 0.75rem; color: #666; text-align: center; margin-top: 5px; font-style: italic; }
        .processing-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center;
            color: var(--accent-cyan); font-size: 1.2rem; z-index: 20; pointer-events: none;
        }
        @media (max-width: 768px) {
            .app-container { flex-direction: column-reverse; }
            .controls { width: 100%; height: 45%; border-right: none; border-top: 1px solid rgba(255,255,255,0.1); }
            .canvas-area { height: 55%; }
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1a1a24; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-cyan); }
    </style>
</head>
<body>

<header>
    <h1>CINE STYLE EDITOR</h1>
    <button id="downloadBtn" class="btn-primary">Скачать фото</button>
</header>

<div class="app-container">
    <div class="controls">
        <div class="control-group">
            <label>Источник изображения</label>
            <div class="upload-buttons">
                <div class="upload-btn-wrapper">
                    <button>🖼️ Галерея</button>
                    <input type="file" id="galleryInput" accept="image/*">
                </div>
                <div class="upload-btn-wrapper">
                    <button>📷 Камера</button>
                    <input type="file" id="cameraInput" accept="image/*" capture="environment">
                </div>
            </div>
        </div>

        <div class="control-group">
            <label>Размер холста</label>
            <select id="canvasSize">
                <option value="original">Оригинал</option>
                <option value="1080x1920">Story (9:16)</option>
                <option value="1920x1080">YouTube (16:9)</option>
                <option value="1080x1080">Instagram Post (1:1)</option>
                <option value="1080x1350">Instagram Portrait (4:5)</option>
                <option value="2400x1080">Cinematic Wide (20:9)</option>
            </select>
            <label>Подгонка фото</label>
            <select id="fitMode">
                <option value="cover">Заполнить (Обрезать)</option>
                <option value="contain">Вписать целиком</option>
                <option value="stretch">Растянуть</option>
            </select>
            <div class="hint">💡 Перетаскивай фото по холсту</div>
        </div>

        <div class="control-group">
            <label>Естественные стили (20)</label>
            <div class="filter-grid" id="filterList"></div>
        </div>

        <div class="control-group">
            <label>Интенсивность эффекта</label>
            <input type="range" id="intensity" min="0" max="100" value="100">
        </div>
        
        <div class="control-group">
             <button onclick="resetPosition()" style="font-size:0.8rem">↺ Сбросить позицию</button>
        </div>
    </div>

    <div class="canvas-area" id="canvasContainer">
        <canvas id="editorCanvas"></canvas>
        <div class="processing-overlay" id="overlay">Обработка...</div>
    </div>
</div>

<script>
    /**
     * Фильтры теперь заданы как числовые параметры для пиксельной обработки.
     * brightness: множитель яркости (1 = норма)
     * contrast: множитель контраста (1 = норма)
     * saturation: множитель насыщенности (1 = норма)
     * sepia: сила сепии (0..1)
     * hueShift: сдвиг оттенка в градусах (-180..180)
     * warmth: тёплый/холодный сдвиг (-1..1, отрицательный = холодный)
     */
    const styles = [
        { name: "Original",          p: { brightness: 1, contrast: 1, saturation: 1, sepia: 0, hueShift: 0, warmth: 0 } },
        { name: "Kodak Portra",      p: { brightness: 1.05, contrast: 0.95, saturation: 1.1, sepia: 0.15, hueShift: 0, warmth: 0.08 } },
        { name: "Fujifilm Classic",  p: { brightness: 1.02, contrast: 1.05, saturation: 1.15, sepia: 0.05, hueShift: -5, warmth: 0.05 } },
        { name: "Noir B&W",          p: { brightness: 0.9, contrast: 1.3, saturation: 0, sepia: 0, hueShift: 0, warmth: 0 } },
        { name: "Urban Night",       p: { brightness: 0.9, contrast: 1.15, saturation: 0.9, sepia: 0.05, hueShift: 8, warmth: -0.05 } },
        { name: "Forest Green",      p: { brightness: 0.95, contrast: 1.05, saturation: 1.1, sepia: 0.08, hueShift: 12, warmth: 0.03 } },
        { name: "Vintage Film",      p: { brightness: 1.1, contrast: 0.9, saturation: 0.9, sepia: 0.35, hueShift: 0, warmth: 0.1 } },
        { name: "Nordic Cold",       p: { brightness: 1.05, contrast: 1.05, saturation: 0.85, sepia: 0, hueShift: 10, warmth: -0.12 } },
        { name: "Golden Hour",       p: { brightness: 1.08, contrast: 0.95, saturation: 1.3, sepia: 0.2, hueShift: 0, warmth: 0.15 } },
        { name: "Pastel Soft",       p: { brightness: 1.1, contrast: 0.9, saturation: 1.1, sepia: 0.05, hueShift: 0, warmth: 0.04 } },
        { name: "High Key",          p: { brightness: 1.2, contrast: 0.85, saturation: 1.05, sepia: 0, hueShift: 0, warmth: 0 } },
        { name: "Low Key",           p: { brightness: 0.8, contrast: 1.3, saturation: 0.95, sepia: 0, hueShift: 0, warmth: 0 } },
        { name: "Cinematic Warm",    p: { brightness: 1.02, contrast: 1.1, saturation: 1.1, sepia: 0.1, hueShift: 0, warmth: 0.1 } },
        { name: "Polaroid",          p: { brightness: 1.08, contrast: 1.05, saturation: 0.9, sepia: 0.2, hueShift: 0, warmth: 0.06 } },
        { name: "Moody Desat",       p: { brightness: 0.9, contrast: 1.2, saturation: 0.7, sepia: 0.05, hueShift: 0, warmth: -0.03 } },
        { name: "Gotham",            p: { brightness: 0.85, contrast: 1.3, saturation: 0.4, sepia: 0.08, hueShift: 0, warmth: -0.05 } },
        { name: "Muted Earth",       p: { brightness: 0.98, contrast: 1.05, saturation: 0.8, sepia: 0.12, hueShift: 0, warmth: 0.06 } },
        { name: "Soft Glow",         p: { brightness: 1.08, contrast: 0.95, saturation: 1.05, sepia: 0.03, hueShift: 0, warmth: 0.02 } },
        { name: "Film Grain Sim",    p: { brightness: 1.02, contrast: 1.1, saturation: 1.05, sepia: 0.06, hueShift: 0, warmth: 0.04 } },
        { name: "Natural Enhanced",  p: { brightness: 1.03, contrast: 1.08, saturation: 1.15, sepia: 0, hueShift: 0, warmth: 0.02 } }
    ];

    const canvas = document.getElementById('editorCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const galleryInput = document.getElementById('galleryInput');
    const cameraInput = document.getElementById('cameraInput');
    const canvasSizeSelect = document.getElementById('canvasSize');
    const fitModeSelect = document.getElementById('fitMode');
    const intensitySlider = document.getElementById('intensity');
    const filterListEl = document.getElementById('filterList');
    const downloadBtn = document.getElementById('downloadBtn');
    const canvasContainer = document.getElementById('canvasContainer');
    const overlay = document.getElementById('overlay');

    let originalImage = null;
    let currentStyleIndex = 0;
    let panX = 0, panY = 0;
    let isDragging = false;
    let startX, startY;
    let renderTimeout = null;

    // --- ПИКСЕЛЬНЫЙ ДВИЖОК ФИЛЬТРОВ ---
    
    function applyPixelFilter(imageData, params, intensity) {
        const data = imageData.data;
        const len = data.length;
        
        // Предвычисление параметров с учётом интенсивности
        const br = 1 + (params.brightness - 1) * intensity;
        const ct = 1 + (params.contrast - 1) * intensity;
        const sat = 1 + (params.saturation - 1) * intensity;
        const sep = params.sepia * intensity;
        const warm = params.warmth * intensity;
        const hShift = params.hueShift * intensity;
        
        // Контрастный фактор
        const ctFactor = (259 * (ct * 128 + 255)) / (255 * (259 - ct * 128));
        
        // Предвычисление синуса/косинуса для hue shift
        const hasHue = Math.abs(hShift) > 0.1;
        const rad = hShift * Math.PI / 180;
        const cosH = Math.cos(rad);
        const sinH = Math.sin(rad);

        for (let i = 0; i < len; i += 4) {
            let r = data[i];
            let g = data[i + 1];
            let b = data[i + 2];

            // Яркость
            r *= br; g *= br; b *= br;

            // Контраст
            r = ctFactor * (r - 128) + 128;
            g = ctFactor * (g - 128) + 128;
            b = ctFactor * (b - 128) + 128;

            // Насыщенность (luminance weights)
            const gray = 0.2126 * r + 0.7152 * g + 0.0722 * b;
            r = gray + sat * (r - gray);
            g = gray + sat * (g - gray);
            b = gray + sat * (b - gray);

            // Сепия
            if (sep > 0) {
                const sr = 0.393 * r + 0.769 * g + 0.189 * b;
                const sg = 0.349 * r + 0.686 * g + 0.168 * b;
                const sb = 0.272 * r + 0.534 * g + 0.131 * b;
                r = r + sep * (sr - r);
                g = g + sep * (sg - g);
                b = b + sep * (sb - b);
            }

            // Тёплый/холодный сдвиг
            if (warm !== 0) {
                r += warm * 30;
                b -= warm * 30;
            }

            // Hue rotation (упрощённая матрица)
            if (hasHue) {
                const nr = r * cosH + g * sinH;
                const ng = -r * sinH + g * cosH;
                r = nr; g = ng;
            }

            // Clamp
            data[i]     = r < 0 ? 0 : r > 255 ? 255 : r | 0;
            data[i + 1] = g < 0 ? 0 : g > 255 ? 255 : g | 0;
            data[i + 2] = b < 0 ? 0 : b > 255 ? 255 : b | 0;
        }
    }

    // --- ОТРИСОВКА ---

    function render() {
        if (!originalImage) {
            ctx.fillStyle = '#1a1a24';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#333';
            ctx.font = '20px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText("Загрузите фото", canvas.width / 2, canvas.height / 2);
            return;
        }

        const cw = canvas.width, ch = canvas.height;
        const iw = originalImage.width, ih = originalImage.height;
        const mode = fitModeSelect.value;
        let dw, dh, dx, dy;

        if (mode === 'stretch') {
            dx = 0; dy = 0; dw = cw; dh = ch;
        } else {
            const scaleCover = Math.max(cw / iw, ch / ih);
            const scaleContain = Math.min(cw / iw, ch / ih);
            const scale = mode === 'cover' ? scaleCover : scaleContain;
            dw = iw * scale;
            dh = ih * scale;
            dx = ((cw - dw) / 2) + panX;
            dy = ((ch - dh) / 2) + panY;
        }

        // Рисуем исходное изображение без фильтров
        ctx.clearRect(0, 0, cw, ch);
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, cw, ch);
        ctx.filter = 'none';
        ctx.drawImage(originalImage, dx, dy, dw, dh);

        // Применяем пиксельный фильтр
        const intensity = parseInt(intensitySlider.value) / 100;
        const styleParams = styles[currentStyleIndex].p;
        
        // Проверяем, нужен ли фильтр вообще
        const isOriginal = currentStyleIndex === 0 && intensity === 0;
        if (!isOriginal) {
            // Определяем область для фильтрации (только видимая часть)
            const fx = Math.max(0, Math.floor(dx));
            const fy = Math.max(0, Math.floor(dy));
            const fw = Math.min(cw - fx, Math.ceil(dw));
            const fh = Math.min(ch - fy, Math.ceil(dh));
            
            if (fw > 0 && fh > 0) {
                try {
                    const imageData = ctx.getImageData(fx, fy, fw, fh);
                    applyPixelFilter(imageData, styleParams, intensity);
                    ctx.putImageData(imageData, fx, fy);
                } catch(e) {
                    console.warn('Filter failed:', e);
                }
            }
        }
    }

    // Debounced render для плавности на мобильных
    function debouncedRender() {
        if (renderTimeout) cancelAnimationFrame(renderTimeout);
        renderTimeout = requestAnimationFrame(() => {
            overlay.style.display = 'flex';
            // Даём браузеру шанс отрисовать оверлей перед тяжёлой операцией
            setTimeout(() => {
                render();
                overlay.style.display = 'none';
            }, 10);
        });
    }

    // --- ИНИЦИАЛИЗАЦИЯ ---

    function initFilters() {
        filterListEl.innerHTML = '';
        styles.forEach((style, index) => {
            const btn = document.createElement('button');
            btn.className = `filter-btn ${index === 0 ? 'active' : ''}`;
            btn.innerText = style.name;
            btn.onclick = () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentStyleIndex = index;
                debouncedRender();
            };
            filterListEl.appendChild(btn);
        });
    }

    function handleFile(file) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
            const img = new Image();
            img.onload = () => {
                originalImage = img;
                resetPosition();
                if (canvasSizeSelect.value === 'original') {
                    canvas.width = img.width;
                    canvas.height = img.height;
                } else {
                    updateCanvasSize();
                }
                debouncedRender();
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    }

    galleryInput.addEventListener('change', (e) => handleFile(e.target.files[0]));
    cameraInput.addEventListener('change', (e) => handleFile(e.target.files[0]));
    canvasSizeSelect.addEventListener('change', () => { resetPosition(); updateCanvasSize(); });
    fitModeSelect.addEventListener('change', () => { resetPosition(); debouncedRender(); });
    intensitySlider.addEventListener('input', debouncedRender);

    function updateCanvasSize() {
        if (!originalImage && canvasSizeSelect.value === 'original') return;
        const val = canvasSizeSelect.value;
        if (val === 'original' && originalImage) {
            canvas.width = originalImage.width;
            canvas.height = originalImage.height;
        } else if (val !== 'original') {
            const [w, h] = val.split('x').map(Number);
            canvas.width = w; canvas.height = h;
        }
        debouncedRender();
    }

    function resetPosition() { panX = 0; panY = 0; debouncedRender(); }

    // --- DRAG & DROP ---
    function getClientCoords(e) {
        if (e.touches && e.touches.length > 0) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
        return { x: e.clientX, y: e.clientY };
    }
    function startDrag(e) {
        if (!originalImage) return;
        isDragging = true;
        const coords = getClientCoords(e);
        startX = coords.x; startY = coords.y;
        canvasContainer.style.cursor = 'grabbing';
    }
    function doDrag(e) {
        if (!isDragging) return;
        e.preventDefault();
        const coords = getClientCoords(e);
        const rect = canvas.getBoundingClientRect();
        panX += (coords.x - startX) * (canvas.width / rect.width);
        panY += (coords.y - startY) * (canvas.height / rect.height);
        startX = coords.x; startY = coords.y;
        requestAnimationFrame(render); // Без debounce для плавности перетаскивания
    }
    function endDrag() { isDragging = false; canvasContainer.style.cursor = 'grab'; }

    canvasContainer.addEventListener('mousedown', startDrag);
    window.addEventListener('mousemove', doDrag);
    window.addEventListener('mouseup', endDrag);
    canvasContainer.addEventListener('touchstart', startDrag, { passive: false });
    window.addEventListener('touchmove', doDrag, { passive: false });
    window.addEventListener('touchend', endDrag);

    // --- СКАЧИВАНИЕ ---
    downloadBtn.addEventListener('click', () => {
        if (!originalImage) return alert("Сначала загрузите фото!");
        const link = document.createElement('a');
        link.download = `cine-natural-${Date.now()}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
    });

    initFilters();
    canvas.width = 1920; canvas.height = 1080;
    render();
</script>

</body>
</html>

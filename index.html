<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CineStyle Editor Natural</title>
    <style>
        :root {
            --bg-color: #0f0f13;
            --panel-bg: #1a1a24;
            --text-color: #e0e0e0;
            --accent-cyan: #00f3ff;
            --accent-pink: #bc13fe;
            --neon-glow: 0 0 10px rgba(0, 243, 255, 0.3), 0 0 20px rgba(188, 19, 254, 0.2);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; user-select: none; -webkit-user-select: none; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            padding: 15px 20px;
            background: linear-gradient(90deg, #1a1a24 0%, #252535 100%);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            z-index: 10;
        }

        h1 {
            font-size: 1.2rem;
            font-weight: 700;
            background: linear-gradient(to right, var(--accent-cyan), var(--accent-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        .app-container { display: flex; flex: 1; overflow: hidden; }

        .controls {
            width: 320px;
            background-color: var(--panel-bg);
            padding: 20px;
            overflow-y: auto;
            border-right: 1px solid rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 5;
        }

        .control-group { display: flex; flex-direction: column; gap: 10px; }

        label { font-size: 0.85rem; color: #aaa; text-transform: uppercase; letter-spacing: 0.5px; }

        button, select {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            outline: none;
            width: 100%;
        }

        button:hover, select:hover { border-color: var(--accent-cyan); box-shadow: 0 0 8px rgba(0, 243, 255, 0.2); }

        .btn-primary {
            background: linear-gradient(45deg, var(--accent-pink), var(--accent-cyan));
            border: none;
            font-weight: bold;
            color: #000;
        }
        
        .btn-primary:hover { opacity: 0.9; box-shadow: var(--neon-glow); }

        /* Новые стили для кнопок загрузки */
        .upload-buttons { display: flex; gap: 8px; }
        .upload-btn-wrapper { position: relative; overflow: hidden; flex: 1; }
        .upload-btn-wrapper input[type=file] {
            position: absolute; left: 0; top: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer;
        }
        .upload-btn-wrapper button { pointer-events: none; }

        .canvas-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: radial-gradient(circle at center, #2a2a35 0%, #0f0f13 100%);
            position: relative;
            overflow: hidden;
            padding: 20px;
            cursor: grab;
        }

        .canvas-area:active { cursor: grabbing; }

        canvas {
            max-width: 100%;
            max-height: 100%;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            border-radius: 4px;
        }

        .filter-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .filter-btn { padding: 8px; font-size: 0.8rem; text-align: center; background: rgba(255,255,255,0.03); }
        .filter-btn.active { background: rgba(0, 243, 255, 0.15); border-color: var(--accent-cyan); color: var(--accent-cyan); }

        input[type=range] { width: 100%; -webkit-appearance: none; background: transparent; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%;
            background: var(--accent-cyan); cursor: pointer; margin-top: -6px;
            box-shadow: 0 0 10px var(--accent-cyan);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 4px; cursor: pointer; background: rgba(255,255,255,0.2); border-radius: 2px;
        }

        .hint { font-size: 0.75rem; color: #666; text-align: center; margin-top: 5px; font-style: italic; }

        @media (max-width: 768px) {
            .app-container { flex-direction: column-reverse; }
            .controls { width: 100%; height: 45%; border-right: none; border-top: 1px solid rgba(255,255,255,0.1); }
            .canvas-area { height: 55%; }
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1a1a24; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-cyan); }
    </style>
</head>
<body>

<header>
    <h1>CINE STYLE EDITOR</h1>
    <button id="downloadBtn" class="btn-primary">Скачать фото</button>
</header>

<div class="app-container">
    <div class="controls">
        <!-- ИСПРАВЛЕННЫЙ БЛОК ЗАГРУЗКИ -->
        <div class="control-group">
            <label>Источник изображения</label>
            <div class="upload-buttons">
                <!-- Кнопка 1: Галерея / Файлы (без capture) -->
                <div class="upload-btn-wrapper">
                    <button>🖼️ Галерея</button>
                    <input type="file" id="galleryInput" accept="image/*">
                </div>
                
                <!-- Кнопка 2: Камера (с capture) -->
                <div class="upload-btn-wrapper">
                    <button>📷 Камера</button>
                    <input type="file" id="cameraInput" accept="image/*" capture="environment">
                </div>
            </div>
        </div>

        <div class="control-group">
            <label>Размер холста</label>
            <select id="canvasSize">
                <option value="original">Оригинал</option>
                <option value="1080x1920">Story (9:16)</option>
                <option value="1920x1080">YouTube/Landscape (16:9)</option>
                <option value="1080x1080">Instagram Post (1:1)</option>
                <option value="1080x1350">Instagram Portrait (4:5)</option>
                <option value="2400x1080">Cinematic UltraWide (20:9)</option>
            </select>
            
            <label>Подгонка фото</label>
            <select id="fitMode">
                <option value="cover">Заполнить (Обрезать лишнее)</option>
                <option value="contain">Вписать целиком (Черные полосы)</option>
                <option value="stretch">Растянуть (Исказить)</option>
            </select>
            <div class="hint">💡 Перетаскивай фото мышкой по холсту</div>
        </div>

        <div class="control-group">
            <label>Естественные стили (20)</label>
            <div class="filter-grid" id="filterList"></div>
        </div>

        <div class="control-group">
            <label>Интенсивность эффекта</label>
            <input type="range" id="intensity" min="0" max="100" value="100">
        </div>
        
        <div class="control-group">
             <button onclick="resetPosition()" style="font-size:0.8rem">↺ Сбросить позицию</button>
        </div>
    </div>

    <div class="canvas-area" id="canvasContainer">
        <canvas id="editorCanvas"></canvas>
    </div>
</div>

<script>
    const styles = [
        { name: "Original", filter: "" },
        { name: "Kodak Portra", filter: "sepia(0.2) contrast(0.95) brightness(1.05) saturate(1.1)" },
        { name: "Fujifilm Classic", filter: "contrast(1.05) saturate(1.15) brightness(1.02) hue-rotate(-5deg)" },
        { name: "Noir B&W", filter: "grayscale(1) contrast(1.3) brightness(0.9)" },
        { name: "Urban Night", filter: "brightness(0.9) contrast(1.15) saturate(0.9) hue-rotate(10deg)" },
        { name: "Forest Green", filter: "saturate(1.1) contrast(1.05) brightness(0.95) sepia(0.1) hue-rotate(15deg)" },
        { name: "Vintage Film", filter: "sepia(0.4) contrast(0.9) brightness(1.1) saturate(0.9)" },
        { name: "Nordic Cold", filter: "brightness(1.05) contrast(1.05) saturate(0.85) hue-rotate(15deg)" },
        { name: "Golden Hour", filter: "sepia(0.3) saturate(1.3) brightness(1.08) contrast(0.95)" },
        { name: "Pastel Soft", filter: "brightness(1.1) contrast(0.9) saturate(1.1) sepia(0.05)" },
        { name: "High Key", filter: "brightness(1.2) contrast(0.85) saturate(1.05)" },
        { name: "Low Key", filter: "brightness(0.8) contrast(1.3) saturate(0.95)" },
        { name: "Cinematic Warm", filter: "sepia(0.15) contrast(1.1) saturate(1.1) brightness(1.02)" },
        { name: "Polaroid", filter: "sepia(0.25) contrast(1.05) brightness(1.08) saturate(0.9)" },
        { name: "Moody Desat", filter: "saturate(0.7) contrast(1.2) brightness(0.9) sepia(0.05)" },
        { name: "Gotham", filter: "grayscale(0.6) contrast(1.3) brightness(0.85) sepia(0.1)" },
        { name: "Muted Earth", filter: "saturate(0.8) contrast(1.05) sepia(0.15) brightness(0.98)" },
        { name: "Soft Glow", filter: "brightness(1.08) contrast(0.95) saturate(1.05) blur(0.3px)" },
        { name: "Film Grain Sim", filter: "contrast(1.1) saturate(1.05) sepia(0.08) brightness(1.02)" },
        { name: "Natural Enhanced", filter: "contrast(1.08) saturate(1.15) brightness(1.03)" }
    ];

    const canvas = document.getElementById('editorCanvas');
    const ctx = canvas.getContext('2d');
    // Два отдельных инпута вместо одного
    const galleryInput = document.getElementById('galleryInput');
    const cameraInput = document.getElementById('cameraInput');
    const canvasSizeSelect = document.getElementById('canvasSize');
    const fitModeSelect = document.getElementById('fitMode');
    const intensitySlider = document.getElementById('intensity');
    const filterListEl = document.getElementById('filterList');
    const downloadBtn = document.getElementById('downloadBtn');
    const canvasContainer = document.getElementById('canvasContainer');

    let originalImage = null;
    let currentStyleIndex = 0;
    let panX = 0, panY = 0;
    let isDragging = false;
    let startX, startY;

    function initFilters() {
        filterListEl.innerHTML = '';
        styles.forEach((style, index) => {
            const btn = document.createElement('button');
            btn.className = `filter-btn ${index === 0 ? 'active' : ''}`;
            btn.innerText = style.name;
            btn.onclick = () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentStyleIndex = index;
                render();
            };
            filterListEl.appendChild(btn);
        });
    }

    // Общая функция обработки файла
    function handleFile(file) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
            const img = new Image();
            img.onload = () => {
                originalImage = img;
                resetPosition();
                if (canvasSizeSelect.value === 'original') {
                    canvas.width = img.width;
                    canvas.height = img.height;
                } else {
                    updateCanvasSize();
                }
                render();
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    }

    // Слушатели для обоих инпутов
    galleryInput.addEventListener('change', (e) => handleFile(e.target.files[0]));
    cameraInput.addEventListener('change', (e) => handleFile(e.target.files[0]));

    canvasSizeSelect.addEventListener('change', () => { resetPosition(); updateCanvasSize(); });
    fitModeSelect.addEventListener('change', () => { resetPosition(); render(); });
    intensitySlider.addEventListener('input', render);

    function updateCanvasSize() {
        if (!originalImage && canvasSizeSelect.value === 'original') return;
        const val = canvasSizeSelect.value;
        if (val === 'original' && originalImage) {
            canvas.width = originalImage.width;
            canvas.height = originalImage.height;
        } else if (val !== 'original') {
            const [w, h] = val.split('x').map(Number);
            canvas.width = w;
            canvas.height = h;
        }
        render();
    }

    function resetPosition() { panX = 0; panY = 0; render(); }

    function getClientCoords(e) {
        if (e.touches && e.touches.length > 0) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
        return { x: e.clientX, y: e.clientY };
    }

    function startDrag(e) {
        if (!originalImage) return;
        isDragging = true;
        const coords = getClientCoords(e);
        startX = coords.x;
        startY = coords.y;
        canvasContainer.style.cursor = 'grabbing';
    }

    function doDrag(e) {
        if (!isDragging) return;
        e.preventDefault();
        const coords = getClientCoords(e);
        const dx = coords.x - startX;
        const dy = coords.y - startY;
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        panX += dx * scaleX;
        panY += dy * scaleY;
        startX = coords.x;
        startY = coords.y;
        requestAnimationFrame(render);
    }

    function endDrag() {
        isDragging = false;
        canvasContainer.style.cursor = 'grab';
    }

    canvasContainer.addEventListener('mousedown', startDrag);
    window.addEventListener('mousemove', doDrag);
    window.addEventListener('mouseup', endDrag);
    canvasContainer.addEventListener('touchstart', startDrag, {passive: false});
    window.addEventListener('touchmove', doDrag, {passive: false});
    window.addEventListener('touchend', endDrag);

    function render() {
        if (!originalImage) {
            ctx.fillStyle = '#1a1a24';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#333';
            ctx.font = '20px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText("Загрузите фото", canvas.width/2, canvas.height/2);
            return;
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const cw = canvas.width, ch = canvas.height;
        const iw = originalImage.width, ih = originalImage.height;
        const mode = fitModeSelect.value;
        let dw, dh, dx, dy;

        if (mode === 'stretch') {
            dx = 0; dy = 0; dw = cw; dh = ch;
        } else {
            const scaleCover = Math.max(cw / iw, ch / ih);
            const scaleContain = Math.min(cw / iw, ch / ih);
            const scale = mode === 'cover' ? scaleCover : scaleContain;
            dw = iw * scale;
            dh = ih * scale;
            dx = ((cw - dw) / 2) + panX;
            dy = ((ch - dh) / 2) + panY;
        }

        const intensity = parseInt(intensitySlider.value) / 100;
        const styleFilter = styles[currentStyleIndex].filter;

        if (intensity < 1 && styleFilter) {
            ctx.filter = 'none';
            ctx.drawImage(originalImage, dx, dy, dw, dh);
            ctx.globalAlpha = intensity;
            ctx.filter = styleFilter;
            ctx.drawImage(originalImage, dx, dy, dw, dh);
            ctx.globalAlpha = 1.0;
        } else {
            ctx.filter = styleFilter || 'none';
            ctx.drawImage(originalImage, dx, dy, dw, dh);
        }
        ctx.filter = 'none';
    }

    downloadBtn.addEventListener('click', () => {
        if (!originalImage) return alert("Сначала загрузите фото!");
        const link = document.createElement('a');
        link.download = `cine-natural-${Date.now()}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
    });

    initFilters();
    canvas.width = 1920;
    canvas.height = 1080;
    render();
</script>

</body>
</html>
